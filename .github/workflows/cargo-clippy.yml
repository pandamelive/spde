name: Cargo Clippy

on:
  pull_request:
    branches: [main]

jobs:
  clippy:
    name: Cargo Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PandaNetOS (path dependency)
        run: |
          git clone --depth 1 https://github.com/PandaNetOS/PandaNetOS.git ../PandaNetOS
          ln -sf PandaNetOS ../pandanetos 2>/dev/null || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure cargo sparse registry
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [source.crates-io]
          replace-with = "crates-io-sparse"

          [source.crates-io-sparse]
          registry = "sparse+https://index.crates.io/"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
