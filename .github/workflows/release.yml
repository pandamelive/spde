name: Release SPDE

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.4）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: PandaNetOS/PandaNetOS/.github/workflows/reusable-release-rust-binary.yml@main
    with:
      binary_name: spde
      project_name: SPDE
      dispatch_downstream: true
      downstream_repo: pcdn-keeper
      version: ${{ inputs.version }}
    secrets:
      PAT_FOR_DOWNSTREAM: ${{ secrets.PAT_FOR_PCDNKEEPER }}
