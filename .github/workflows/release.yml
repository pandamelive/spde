name: Release SPDE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: PandaNetOS/PandaNetOS/.github/workflows/reusable-release-rust-binary.yml@main
    with:
      binary_name: spde
      project_name: SPDE
      dispatch_downstream: true
      downstream_repo: pcdn-keeper
    secrets: inherit
