[workspace]
members = ["."]
resolver = "2"
exclude = ["PandaNetOS"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
config = { version = "0.14", features = ["yaml"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[package]
name = "spde"
version = "1.2.1"
edition = "2021"
description = "SPDE Super-Download-Engine 统一下载中心，单点CLI版本"
license = "MIT"

[dependencies]
pandanetos = { path = "../PandaNetOS/crates/pandanetos" }
crossbeam = "0.8"
rand = "0.8"
regex = "1"
tracing = "0.1"
clap = { version = "=4.5.20", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.10", features = ["v4", "serde"] }
hostname = "0.4"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-util", "net", "sync", "process"] }
futures-util = "0.3.34"
tokio-tungstenite = "0.26"
reqwest = { version = "0.13.4", features = ["rustls", "stream", "system-proxy", "socks", "json", "http2"] }
url = "2.5.8"
percent-encoding = "2.3.2"
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
parking_lot = "0.12"
futures-lite = "2"
suppaftp = { version = "5", optional = true, features = ["async"] }
librqbit = { version = "9", optional = true }

[features]
default = ["ftp", "torrent"]
ftp = ["dep:suppaftp"]
torrent = ["dep:librqbit"]

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["lib"]

[[bin]]
name = "spde"
path = "src/bin/main.rs"

[profile.release]
codegen-units = 256
lto = false
