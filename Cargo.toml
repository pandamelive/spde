[package]
name = "spde"
version = "0.7.1"
edition = "2021"
description = "SPDE Super‑Download‑Engine 统一下载中心，单点CLI版本"
license = "MIT"

[dependencies]
pandanetos = { path = "../PandaNetOS/crates/pandanetos" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.10", features = ["v4", "serde"] }
hostname = "0.4"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-util", "net", "sync", "process"] }
futures-util = "0.3.34"
tokio-tungstenite = "0.26"
reqwest = { version = "0.13.4", features = ["rustls", "stream", "system-proxy", "socks", "json", "http2"] }
url = "2.5.8"
percent-encoding = "2.3.2"
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
parking_lot = "0.12"
futures-lite = "2"
suppaftp = { version = "5", optional = true, features = ["async"] }
librqbit = { version = "9", optional = true }
# librqbit 通过 crypto-hash 引入 openssl，vendored 模式编译时自动下载编译 OpenSSL
# 解决 musl/Windows 交叉编译时找不到系统 OpenSSL 的问题
openssl = { version = "0.10", features = ["vendored"] }

[features]
default = ["ftp", "torrent"]
ftp = ["dep:suppaftp"]
torrent = ["dep:librqbit"]

[lib]
crate-type = ["lib"]

[[bin]]
name = "spde"
path = "src/bin/main.rs"

[profile.release]
# 增加并行编译单元，加快编译速度（默认16，二进制稍大但下载工具可接受）
codegen-units = 256
# 关闭链接时优化，大幅加快链接速度（默认就是false，显式声明）
lto = false
